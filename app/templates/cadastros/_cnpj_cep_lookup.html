{% if not view_mode %}
<script>
  (function () {
    const onlyDigits = (value) => String(value || '').replace(/\D/g, '');
    const el = (id) => document.getElementById(id);
    const nomeFieldId = '{{ cnpj_nome_field|default("") }}';
    const fantasiaFieldId = '{{ cnpj_fantasia_field|default("") }}';

    function setMessage(id, text, type) {
      const message = el(id);
      if (!message) return;
      const colors = { error: 'text-rose-600', success: 'text-emerald-600', info: 'text-sky-600' };
      message.className = `text-[10px] mt-1 h-3 ${colors[type] || 'text-slate-500'}`;
      message.textContent = text || '';
    }

    function fillIfEmpty(id, value) {
      const input = el(id);
      if (!input || !value || input.value.trim()) return;
      input.value = value;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function formatCep(value) {
      const digits = onlyDigits(value).slice(0, 8);
      return digits.length > 5 ? `${digits.slice(0, 5)}-${digits.slice(5)}` : digits;
    }

    function formatCnpj(value) {
      const digits = onlyDigits(value).slice(0, 14);
      const parts = digits.match(/^(\d{0,2})(\d{0,3})(\d{0,3})(\d{0,4})(\d{0,2})$/);
      if (!parts) return digits;
      return !parts[2] ? parts[1] : parts[1] + '.' + parts[2] + '.' + parts[3] + '/' + parts[4] + (parts[5] ? '-' + parts[5] : '');
    }

    function isValidCnpj(value) {
      const cnpj = onlyDigits(value);
      if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
      const calc = (base) => {
        let sum = 0;
        let pos = base.length - 7;
        for (let i = base.length; i >= 1; i--) {
          sum += Number(base.charAt(base.length - i)) * pos--;
          if (pos < 2) pos = 9;
        }
        return String(sum % 11 < 2 ? 0 : 11 - (sum % 11));
      };
      return calc(cnpj.substring(0, 12)) === cnpj.charAt(12) && calc(cnpj.substring(0, 13)) === cnpj.charAt(13);
    }

    function buildCnpjLogradouro(data) {
      const tipo = data.descricao_tipo_de_logradouro || data.tipo_logradouro || '';
      const logradouro = data.logradouro || '';
      if (!tipo) return logradouro;
      if (!logradouro) return tipo;
      return logradouro.toLowerCase().startsWith(tipo.toLowerCase()) ? logradouro : `${tipo} ${logradouro}`;
    }

    async function searchCep() {
      const cepInput = el('cep');
      const cep = onlyDigits(cepInput ? cepInput.value : '');
      if (!cep) {
        setMessage('cep-message', '');
        return;
      }
      if (cep.length !== 8) {
        setMessage('cep-message', 'CEP deve conter 8 dígitos.', 'error');
        return;
      }

      setMessage('cep-message', 'Buscando CEP...', 'info');
      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        if (!response.ok) throw new Error('Erro ViaCEP');
        const data = await response.json();
        if (data.erro) {
          setMessage('cep-message', 'CEP não encontrado.', 'error');
          return;
        }
        fillIfEmpty('logradouro', data.logradouro);
        fillIfEmpty('bairro', data.bairro);
        fillIfEmpty('cidade', data.localidade);
        fillIfEmpty('estado', data.uf);
        if (cepInput) cepInput.dataset.validatedCep = cep;
        setMessage('cep-message', 'Endereço preenchido pelo CEP.', 'success');
        if (el('numero') && !el('numero').value) el('numero').focus();
      } catch (error) {
        setMessage('cep-message', 'Erro ao buscar CEP. Tente novamente.', 'error');
      }
    }

    async function searchCnpj() {
      const cnpjInput = el('cnpj');
      const cnpj = onlyDigits(cnpjInput ? cnpjInput.value : '');
      if (!cnpj) {
        setMessage('cnpj-message', '');
        return;
      }
      if (!isValidCnpj(cnpj)) {
        setMessage('cnpj-message', 'CNPJ inválido.', 'error');
        return;
      }

      setMessage('cnpj-message', 'Buscando dados do CNPJ...', 'info');
      try {
        const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
        if (response.status === 404) {
          setMessage('cnpj-message', 'CNPJ não encontrado.', 'error');
          return;
        }
        if (!response.ok) throw new Error('Erro BrasilAPI');
        const data = await response.json();
        fillIfEmpty(nomeFieldId, data.razao_social || data.nome_fantasia);
        fillIfEmpty(fantasiaFieldId, data.nome_fantasia);
        fillIfEmpty('logradouro', buildCnpjLogradouro(data));
        fillIfEmpty('numero', data.numero);
        fillIfEmpty('complemento', data.complemento);
        fillIfEmpty('bairro', data.bairro);
        fillIfEmpty('cidade', data.municipio);
        fillIfEmpty('estado', data.uf);
        if (data.cep && el('cep') && !onlyDigits(el('cep').value)) el('cep').value = formatCep(data.cep);
        setMessage('cnpj-message', 'Dados do CNPJ carregados.', 'success');
      } catch (error) {
        setMessage('cnpj-message', 'Erro ao consultar CNPJ. Tente novamente.', 'error');
      }
    }

    const cnpjInput = el('cnpj');
    if (cnpjInput) {
      cnpjInput.value = formatCnpj(cnpjInput.value);
      cnpjInput.addEventListener('input', (event) => {
        event.target.value = formatCnpj(event.target.value);
        setMessage('cnpj-message', '');
      });
      cnpjInput.addEventListener('blur', searchCnpj);
    }

    const cepInput = el('cep');
    if (cepInput) {
      cepInput.value = formatCep(cepInput.value);
      cepInput.addEventListener('input', (event) => {
        event.target.value = formatCep(event.target.value);
        event.target.dataset.validatedCep = '';
        setMessage('cep-message', '');
      });
      cepInput.addEventListener('blur', searchCep);
    }

    const estadoInput = el('estado');
    if (estadoInput) {
      estadoInput.addEventListener('input', (event) => {
        event.target.value = event.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
      });
    }

    const form = cnpjInput ? cnpjInput.closest('form') : null;
    if (form) {
      form.addEventListener('submit', () => {
        if (cnpjInput) cnpjInput.value = onlyDigits(cnpjInput.value);
        if (cepInput) cepInput.value = onlyDigits(cepInput.value);
        if (estadoInput) estadoInput.value = estadoInput.value.toUpperCase();
      });
    }
  })();
</script>
{% endif %}
